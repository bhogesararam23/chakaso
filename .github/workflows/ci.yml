name: CI

# Runs exactly the commands documented in CONTRIBUTING.md and AGENTS.md, on a machine with no GPU, no
# secrets and no access to a model provider. A check that cannot run on a fork is not a check.
#
# Three tiers, because that is what the package declares. `checks` installs only `.[dev]` and is the
# guarantee that `import chakaso`, the runtime, retrieval, the CLI and the HTTP serving adapter need no
# numerical library at all — the model-path tests skip there by design, which is why a second and third
# job exist. `train` adds numpy and runs the character model's tests. `model-path` adds torch from the CPU
# wheel index and type-checks every module, including the ones the base tier cannot resolve.
#
# A fourth job runs `model-path` on a Windows runner. It is not a tier: nothing in the package declares a
# Windows-only extra. It is the same suite on the platform the project is developed on and CI did not test.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: core python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The declared floor is tested, not just documented.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Format
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Types
        run: python -m mypy src

      - name: Tests
        run: python -m pytest

      - name: Verify the installed entry point
        run: |
          python -m chakaso --version
          chakaso info

  train:
    name: train python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,train]"

      - name: Types
        run: python -m mypy src

      - name: Tests
        run: python -m pytest

  model-path:
    name: model path python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and the latest, not all three: torch is a ~200 MB download, and the failures it can
        # introduce across minor versions are a wheel that does not exist or an operator signature that
        # changed — both of which show up at an end of the supported range.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,train,nn]" --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Types
        run: python -m mypy --config-file configs/mypy-model-path.toml

      - name: Tests
        run: python -m pytest

  windows:
    name: windows model path python ${{ matrix.python-version }}
    runs-on: windows-latest

    # The development machine is Windows 11 and the three jobs above are Linux. A green matrix on one
    # platform is not evidence about the other: AGENTS.md's own recorded trap is that `mypy --platform
    # linux` found a `ctypes.WinDLL` that every Windows gate had passed. This job runs that check the other
    # way round, so a Windows-only defect in path handling, file locking or the checkpoint loader fails a
    # job instead of surprising the only machine that can see it.
    #
    # The full suite runs here as `model-path` runs it on Linux, and the two areas this milestone changed
    # are then re-selected into their own steps — not because the whole run does not cover them, which it
    # does, but so that a Windows-specific failure in recovery says "Seed-study recovery failed" rather than
    # arriving as line 1,900 of one red block.
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        # No --extra-index-url on purpose: PyPI's default `torch` wheel for Windows *is* the CPU build,
        # which is the opposite of the Linux case ADR-0034 records.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,train,nn]"

      - name: Format
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Types
        run: python -m mypy --config-file configs/mypy-model-path.toml

      - name: Tests
        run: python -m pytest

      - name: Checkpoint serialization and restoration
        run: python -m pytest tests/test_training_nn_checkpoint.py tests/test_training_recovery.py

      - name: Seed-study recovery
        run: python -m pytest tests/test_training_seed_study.py tests/test_training_subword_experiment.py

      - name: Verify the installed entry points
        run: |
          python -m chakaso --version
          chakaso info
          chakaso experiment model --help
          chakaso experiment study --help
          chakaso model inspect --help
