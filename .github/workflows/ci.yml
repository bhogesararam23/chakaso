name: CI

# Runs exactly the commands documented in CONTRIBUTING.md and AGENTS.md, on a
# machine with no GPU, no secrets and no access to a model provider. A check that
# cannot run on a fork is not a check.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The declared floor is tested, not just documented.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Format
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Types
        run: python -m mypy src

      - name: Tests
        run: python -m pytest

      - name: Verify the installed entry point
        run: |
          python -m chakaso --version
          chakaso info
