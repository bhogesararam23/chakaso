# E2624 protocol - H17 at equal TEXT: E2620's space-prefixed vocabulary (now a committed input, ADR-0044) trained on exactly the
# documents the control reads, for the number of updates that gives it the same fraction of that pool (0.983).
#
# Read by `chakaso experiment study --protocol` with `--seeds 7`. Declared before any run (experiments/E2624/record.md).
# Differences from E2620's protocol: the vocabulary is read from the committed file instead of fitted; max_training_tokens 14,033,424
# is the cap that selects the control's own 2,756 training documents when counted with the space-prefixed vocabulary (the control's
# 20,000,103 identifiers under the default one); max_steps 1,684 = 2,400 x 14,033,424 / 20,000,103 reads the same 0.983 of the pool;
# warmup (140) and evaluation interval (281) keep the same fractions of the schedule. A test holds the file to those differences.

[plan]
model_family = "decoder"

# Architecture and optimisation (E2608 arm A, the reference configuration).
vocab_size = 4096
context_length = 256
d_model = 256
num_layers = 4
num_heads = 8
feedforward_dim = 640
batch_size = 32
grad_accum_steps = 1
learning_rate = 0.0006
weight_decay = 0.01
warmup_steps = 140
schedule = "cosine"
decay_to = 0.1
max_steps = 1684
eval_every = 281
patience = 99

# Data: the pinned multi-register corpus, held out by whole work, all five registers in training.
split_seed = 7
expected_corpus_fingerprint = "312571f9fa8351a8"
whole_work_splits = true
shuffle_training_units = true
max_training_tokens = 14033424
max_validation_tokens = 250000
max_test_tokens = 250000
test_partitions = ["prose-", "science-", "technology-", "medicine-", "mathematics-"]
character_baseline = false

# Tokenizer: the vocabulary E2612 trained with, as a committed input (ADR-0044), checked by fingerprint.
tokenizer_min_frequency = 3
tokenizer_sample_characters = 12000000
tokenizer_pre_tokenizer = "space-prefixed-word|space-prefixed-symbol|whitespace-run"
tokenizer_file = "experiments/E2620/vocabulary-4a47f0281c81a9e5.json"
expected_tokenizer_fingerprint = "4a47f0281c81a9e5"
evaluation_selection_tokenizer_file = "experiments/E2612/vocabulary-434debe82f949347.json"

# Generation: continuations of held-out openings, never the repository's own headings (K-026).
sample_prompts = "held_out"
