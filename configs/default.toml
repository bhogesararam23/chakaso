# Default Chakaso configuration.
#
# Every value here matches the built-in default declared in
# src/chakaso/config/schema.py. tests/test_config.py asserts that the two agree, so
# this file cannot silently stop describing what the code actually does.
#
# This file is versioned for a reason: a run should be reproducible from the
# repository rather than from somebody's memory of what they changed. Machine-local
# overrides belong in configs/local.toml, which is git-ignored, and are applied by
# passing them explicitly:
#
#     chakaso config show --config configs/default.toml --config configs/local.toml
#
# Nothing reads this file implicitly. Loading is always an explicit request.

[model]
# Which registered language-model adapter the application uses. This file is the
# single composition point where a concrete implementation is chosen (ADR-0002).
#
# "deterministic" is a development double, not a language model: it produces fixed
# text so that conversation, evidence and citation logic can be tested without
# weights, a GPU or a download. There is no trained Chakaso model and no local
# inference adapter yet. When one exists, this value changes, and so does the
# default in schema.py.
adapter = "deterministic"

# Ceiling on generated tokens for one response, before the model's own context
# limit is considered.
max_new_tokens = 256

# 0.0 means greedy decoding. Sampling is a deliberate choice, not a default.
temperature = 0.0

# How many of the most recent turns are projected into a model request. A stopgap
# until token counting exists: it bounds growth, it is not a token budget, and it
# cannot be described as fitting the model's context window. The value is a
# deliberately conservative placeholder rather than a measured optimum.
max_context_turns = 40

# Path to a trained model checkpoint, used only by the optional "trained_char"
# adapter (P25, ADR-0030) — which requires the [train] extra and is never selected by
# default. Empty here so the shipped configuration loads no weights and the base
# install stays dependency-free; the trained_char adapter refuses an empty or missing
# path rather than falling back to the double.
checkpoint_path = ""

[storage]
# Which answer-store backend a retrieval-aware runtime would use (ADR-0021). This is
# the single place the persistence mechanism is chosen, exactly as [model].adapter is
# the single place the language model is chosen (ADR-0002).
#
# "memory" is the default: the in-memory, append-only store that loses history at
# process exit (ADR-0018). "sqlite" selects the durable local store, which survives a
# restart but must be pointed at an explicit path below — nothing writes to disk unless
# both are set. There is no hosted or third-party database option (ADR-0001).
backend = "memory"

# File path for the durable SQLite store. Empty by default so the built-in
# configuration writes nothing anywhere; a real deployment sets this to a location it
# controls, and tests point it at a temporary directory, never the repository tree.
path = ""

# SQLite journal mode. "delete" is SQLite's own default. "wal" trades extra side-car
# files for readers that are not blocked by a writer; no tested workload needs that yet.
journal_mode = "delete"

[retrieval]
# Whether a conversation turn is grounded in retrieved evidence by the retrieval-aware
# runtime (ADR-0025). On by default so `chakaso chat` runs through the real composition —
# planner, retrieval, model boundary, answer record — rather than the bare conversation.
# With no documents supplied the planner still runs and retrieval honestly returns an
# empty pack; no evidence is invented. Turning this off restores a retrieval-free turn.
enabled = true

# Which retriever the planner selects when it decides to retrieve. All three are backed by
# a retriever, so an explicit choice is honoured and never silently falls back to another:
# "lexical" (BM25), "dense" (an exact similarity index) and "hybrid" (reciprocal-rank
# fusion). "dense" and "hybrid" run over the non-semantic fixture embedding (ADR-0023/24),
# so they exercise the boundary and reproduce, but they are not semantic understanding.
strategy = "lexical"

# How many chunks a retrieval turn returns.
top_k = 5

# The per-component candidate pool for hybrid fusion, used only when strategy is "hybrid"
# (ADR-0024). Over-retrieving here trades latency for a better merged ranking.
candidate_k = 10

# The reciprocal-rank-fusion smoothing constant for the "hybrid" strategy (the published
# default is 60). A larger value flattens the influence of the top ranks.
rrf_k = 60

# Maximum size, in bytes, of a local document the runtime will read into the corpus. It is
# checked against the file's size before its bytes are loaded, so an oversized file is
# refused rather than allowed to exhaust memory.
max_ingest_bytes = 10485760
