[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "chakaso"
version = "0.1.0"
description = "An open research project exploring transparent, grounded, and self-trained language models."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Ram Bhogesara" }
]
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/chakaso"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
