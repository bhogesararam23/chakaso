[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chakaso"
dynamic = ["version"]
description = "Language-model research: a from-scratch-trained model with its tokenizer, checkpoints and held-out evaluation, and an optional local-first retrieval-grounded conversation layer over it."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ram Bhogesara" }]
keywords = [
    "language-models",
    "language-model-training",
    "tokenization",
    "reproducibility",
    "retrieval-augmented-generation",
    "provenance",
    "citations",
    "uncertainty",
    "research",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The foundation is deliberately dependency-free: configuration, identifiers,
# records and the model boundary are expressible with the standard library.
# Heavy components (inference runtimes, tokenizers, embedding stacks, vector
# indexes) are added by the module that needs them and stay optional, so the test
# environment remains installable on a machine with no GPU.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "ruff>=0.9,<1",
    "mypy>=1.11,<2",
]
# ADR-0030: the minimal offline numerical stack for a from-scratch training experiment, kept out of
# the base install and the core CI matrix. `numpy<2.5` is deliberate — NumPy 2.5 dropped the Python
# 3.11 floor this project supports — so `pip install -e ".[train]"` still resolves on 3.11, 3.12 and
# 3.13. Training code lives in `chakaso.training` (the module ADR-0005 reserved for it) and imports
# numpy only there; `import chakaso` must never require it.
train = [
    "numpy>=1.26,<2.5",
]
# ADR-0034: the automatic-differentiation stack for the Transformer path, in its own extra so that
# [train] keeps carrying exactly numpy (a hygiene test enforces that) and so the dependency-free tier of
# the training layer stays importable in the core CI matrix. The >=2.6 floor is deliberate: torch.load
# defaults to weights_only=True from 2.6, and the checkpoint format admits nothing that unpickles
# arbitrary objects. <3 bounds the major because the serialization and TransformerEncoderLayer argument
# surfaces have changed incompatibly before. Modules permitted to import torch are listed in ADR-0034 and
# enforced by tests/test_repository_hygiene.py; on Linux the CPU wheels come from
# --extra-index-url https://download.pytorch.org/whl/cpu, not from PyPI's default wheel.
nn = [
    "torch>=2.6,<3",
]

[project.scripts]
chakaso = "chakaso.cli:main"

[project.urls]
Homepage = "https://github.com/bhogesararam23/chakaso"
Repository = "https://github.com/bhogesararam23/chakaso"
Issues = "https://github.com/bhogesararam23/chakaso/issues"
Changelog = "https://github.com/bhogesararam23/chakaso/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chakaso = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "chakaso.__version__" }

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# The default run never reaches the network. A test that needs it must say so.
addopts = "-ra --strict-markers --strict-config -m 'not network'"
markers = [
    "network: requires network access (deselected by default)",
    "slow: takes more than a couple of seconds",
]
filterwarnings = ["error"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Rules are listed explicitly rather than inherited from the defaults, so that
# enabling one is a visible change with a reason.
select = [
    "A",    # builtin shadowing
    "ARG",  # unused arguments
    "B",    # bugbear
    "C4",   # comprehensions
    "E",    # pycodestyle errors
    "EM",   # exception message construction
    "F",    # pyflakes
    "I",    # import sorting
    "N",    # naming
    "PTH",  # pathlib over os.path
    "RET",  # return statement simplification
    "RUF",  # ruff-specific
    "SIM",  # simplification
    "T20",  # print statements
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    # The formatter owns line length; E501 duplicates that decision and disagrees
    # with it about long URLs and strings.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# A command line interface exists to write to stdout.
"src/chakaso/cli.py" = ["T20"]
# The urllib redirect handler that refuses redirects must accept the arguments of the
# method it overrides and uses none of them; refusing every redirect is the point. ARG002
# would otherwise demand noqa markers on each parameter line.
"src/chakaso/retrieval/acquire.py" = ["ARG002"]
# Test doubles implement interfaces and routinely do not use every parameter — a
# fake model that ignores the messages it was given is often exactly the point. The
# rule stays on for `src`, where an unused argument usually means a mistake. ARG002
# reports on the parameter line, so per-line suppressions would outnumber the code
# they annotate.
"tests/*" = ["T20", "ARG002"]
# Operator scripts report progress to a terminal; that is their interface.
"scripts/*" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["chakaso"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src"]
# Strict mode is deliberate: this project's product is its interfaces, and a type
# error at a boundary is a defect that tests written against the same wrong
# assumption will not catch.
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
pretty = true

# numpy is an optional [train] dependency (ADR-0030) and torch an optional [nn] one (ADR-0034), and the
# dependency-free core CI matrix installs only .[dev] — so both are absent when the default `mypy src`
# runs, and the modules that import them cannot resolve their types. Excluding them keeps the documented
# `mypy src` command green on a dependency-free machine without editing CI workflow files.
#
# The exclusion is scoping, not exemption: those modules are type-checked too, by
# `mypy --config-file configs/mypy-model-path.toml` run where both extras are installed. A `--exclude` on
# the command line *adds* to this list rather than replacing it, so that file — not a flag — is how the
# full package is checked. A hygiene test keeps the two configurations' strictness identical and fails if
# this exclusion grows beyond the modules whose dependency it names.
exclude = ['chakaso/training', 'chakaso/models/trainedchar', 'chakaso/models/nntransformer']

# When numpy is present this is a real typed library; when it is absent mypy must not fail to resolve
# its types, so treat an unresolvable numpy as untyped rather than an error.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
ignore_missing_imports = true
